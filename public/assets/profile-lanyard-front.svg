<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1448" viewBox="0 0 1024 1448">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#300608"/>
      <stop offset="0.5" stop-color="#080102"/>
      <stop offset="1" stop-color="#651015"/>
    </linearGradient>
    <radialGradient id="glow" cx="26%" cy="14%" r="82%">
      <stop offset="0" stop-color="#ffc4b8" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#e52c30" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#060203" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="photoClip">
      <rect x="96" y="246" width="320" height="420" rx="40"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
  </defs>

  <rect width="1024" height="1448" rx="78" fill="url(#cardBg)"/>
  <rect width="1024" height="1448" rx="78" fill="url(#glow)"/>
  <circle cx="512" cy="98" r="34" fill="#050101" stroke="#ffffff" stroke-opacity="0.32" stroke-width="4"/>
  <circle cx="512" cy="98" r="14" fill="#ffffff" fill-opacity="0.34"/>
  <path d="M76 132 H948" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>

  <g filter="url(#softShadow)">
    <rect x="80" y="230" width="352" height="452" rx="48" fill="#f4f0ea"/>
    <image href="/assets/profile-lanyard-photo.jpg" x="96" y="246" width="320" height="420" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)"/>
  </g>

  <text x="472" y="292" fill="#ff9b86" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="7">PERSONAL ID</text>
  <text x="472" y="386" fill="#ffffff" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="92" font-weight="800">龚玥月</text>
  <text x="476" y="462" fill="#ffffff" fill-opacity="0.78" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800">Emore</text>
  <text x="476" y="550" fill="#ffffff" fill-opacity="0.72" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">AI Film &amp; Visual Design</text>
  <text x="476" y="606" fill="#ffffff" fill-opacity="0.58" font-family="'Noto Sans SC', Arial, sans-serif" font-size="30">戏剧影视美术设计</text>

  <rect x="80" y="744" width="864" height="286" rx="36" fill="#ffffff" fill-opacity="0.052" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="122" y="824" fill="#ff9b86" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="6">PROFILE</text>
  <text x="122" y="902" fill="#ffffff" fill-opacity="0.84" font-family="'Noto Sans SC', Arial, sans-serif" font-size="38">重庆大学美视电影学院</text>
  <text x="122" y="968" fill="#ffffff" fill-opacity="0.7" font-family="'Noto Sans SC', Arial, sans-serif" font-size="32">AI 短片、场景设计、人物造型与</text>
  <text x="122" y="1022" fill="#ffffff" fill-opacity="0.7" font-family="'Noto Sans SC', Arial, sans-serif" font-size="32">跨媒介视觉设计。</text>

  <text x="122" y="1146" fill="#ff9b86" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="6">FOCUS</text>
  <g fill="#ffffff" fill-opacity="0.78" font-family="'Noto Sans SC', Arial, sans-serif" font-size="34">
    <text x="122" y="1212">短片作品 / 场景设计</text>
    <text x="122" y="1276">人物造型 / 创意设计</text>
  </g>

  <path d="M80 1330 H944" stroke="#ffffff" stroke-opacity="0.13" stroke-width="2"/>
  <text x="122" y="1384" fill="#ffffff" fill-opacity="0.44" font-family="Inter, Arial, sans-serif" font-size="24" letter-spacing="5">GONG YUEYUE PORTFOLIO 2026</text>
